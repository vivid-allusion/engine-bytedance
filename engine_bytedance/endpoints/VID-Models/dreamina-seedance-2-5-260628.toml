id = "dreamina-seedance-2-5-260628"
label = "Seedance 2.5"
category = "VID"
platform = "bytedance"
endpoint = "dreamina-seedance-2-5-260628"
api_path = "contents/generations/tasks"
mode = "async"
payload_style = "content_array"
description = "Seedance 2.5: Seedance on BytePlus ModelArk. Prompt and any reference image ride in a content array."

[pricing]
currency = "USD"
cost_per_second = 0.231
note = "720p, 16:9, no video input: BytePlus's example price of $1.156 for 5 s. engine_bytedance.pricing.estimate_cost prices a clip exactly."

[general]
kind = "video"
draft_mode = true
prompt = "required"
image_url_param = "image_url"
duration_param_name = "duration"

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 4
max = 30
also = [-1]
note = "-1 lets the model pick the length."

[params.ratio]
label = "Ratio"
type = "select"
default = "adaptive"
options = [
  { value = "adaptive", label = "adaptive" },
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "1:1", label = "1:1" },
]

[params.resolution]
label = "Resolution"
type = "select"
default = "720p"
options = [
  { value = "480p", label = "480p" },
  { value = "720p", label = "720p" },
  { value = "1080p", label = "1080p (10-bit)" },
  { value = "4k", label = "4k" },
]
note = "BytePlus's public Seedance 2.5 reference lists 480p, 720p and 1080p only; 4k is accepted on the whitelist-only Premium model (dreamina-seedance-2-5-premium-260915) and is rejected by accounts outside that program. A Draft preview is always 480p."

[params.watermark]
label = "Watermark"
type = "boolean"
default = false

[params.generate_audio]
label = "Generate Audio"
type = "boolean"
default = false
note = "Off by default: a generated soundtrack can trip the provider's copyright filter and fail the whole job."
