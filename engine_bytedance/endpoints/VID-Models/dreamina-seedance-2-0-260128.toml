id = "dreamina-seedance-2-0-260128"
label = "Seedance 2.0"
category = "VID"
platform = "bytedance"
endpoint = "dreamina-seedance-2-0-260128"
api_path = "contents/generations/tasks"
mode = "async"
payload_style = "content_array"
description = "Seedance 2.0: Seedance on BytePlus ModelArk. Prompt and any reference image ride in a content array."

[pricing]
note = "unset — take the price from BytePlus own pricing page before shipping"

[general]
kind = "video"
prompt = "required"
image_url_param = "image_url"
duration_param_name = "duration"

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 2
max = 12

[params.ratio]
label = "Ratio"
type = "select"
default = "adaptive"
options = [
  { value = "adaptive", label = "adaptive" },
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "1:1", label = "1:1" },
]

[params.resolution]
label = "Resolution"
type = "select"
default = "720p"
options = [
  { value = "480p", label = "480p" },
  { value = "720p", label = "720p" },
  { value = "1080p", label = "1080p" },
  { value = "4k", label = "4k (10-bit)" },
]
note = "4k is documented for Seedance 2.0: 3840x2160 at 16:9, 10-bit, H.265/HEVC encoding."

[params.watermark]
label = "Watermark"
type = "boolean"
default = false

[params.generate_audio]
label = "Generate Audio"
type = "boolean"
default = false
note = "Off by default: a generated soundtrack can trip the provider's copyright filter and fail the whole job."
